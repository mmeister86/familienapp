<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Familie" />
    <title>Familienapp</title>
    <script>
      // Follow the system colour scheme before first paint (applies `.dark`).
      (function () {
        var query = window.matchMedia("(prefers-color-scheme: dark)")
        var apply = function () {
          document.documentElement.classList.toggle("dark", query.matches)
        }
        apply()
        query.addEventListener("change", apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
